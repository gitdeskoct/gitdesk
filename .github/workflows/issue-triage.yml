# Labels and assigns new issues and flags probable duplicates. Never closes anything.
name: Issue triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Issue events run from the default branch, so this is reviewed code, never a contributor's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const triage = require('./.github/scripts/triage.cjs');
            const config = require('./.github/triage.json');
            await triage.main({ github, context, core, config });
