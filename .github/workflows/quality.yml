# Checks every change. No secrets: pull requests from anyone run this. Pushes to main run it
# through Release, on the commit that release is built from.
name: Quality

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check; empty checks the one that started the run.
        type: string
        default: ''
    secrets:
      API_ORIGIN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The main-process tests run real Git; some commit in temp folders.
      - run: |
          git config --global user.name "gitdesk CI"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  scripts:
    name: Repository scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test ".github/scripts/*.test.cjs"

  package:
    name: Package smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_ORIGIN: ${{ secrets.API_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Packaged smoke test unavailable without API_ORIGIN
        if: ${{ env.API_ORIGIN == '' }}
        run: echo "::notice::Skipping packaged-app smoke test because API_ORIGIN is unavailable to this workflow."
      # Packaged builds refuse a non-https API origin, so the smoke build needs a real one baked in.
      - if: ${{ env.API_ORIGIN != '' }}
        run: |
          case "$API_ORIGIN" in
            https://*) ;;
            *) echo "::error::Set the API_ORIGIN repository secret to the Worker's https origin."; exit 1 ;;
          esac
          npm run dist:dir -- --linux
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          VITE_API_ORIGIN: ${{ secrets.API_ORIGIN }}
      - name: Updater metadata is packaged
        if: ${{ env.API_ORIGIN != '' }}
        run: test -f dist/linux-unpacked/resources/app-update.yml
      - name: Launch the packaged app
        if: ${{ env.API_ORIGIN != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/scripts/smoke-linux.sh dist/linux-unpacked/gitdesk
