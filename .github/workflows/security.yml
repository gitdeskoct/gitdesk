# Known-vulnerability check of both lockfiles. CodeQL needs GitHub Code Security on a private
# repository, so it is not set up here.
name: Security

on:
  pull_request:
    paths:
      - package-lock.json
      - backend/package-lock.json
      - .github/workflows/security.yml
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (${{ matrix.dir }})
    strategy:
      fail-fast: false
      matrix:
        # Everything in the desktop app is bundled into the shipped asar, dev dependencies included,
        # so the app audits its whole tree. The Worker ships only its production dependencies.
        include:
          - dir: .
            args: ''
          - dir: backend
            args: --omit=dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --audit-level=high ${{ matrix.args }}
