# Every push to main is a release: it picks the next version (.github/scripts/next-version.cjs),
# runs Quality on that commit, creates a versioned tag,
# builds every installer from the tag and publishes stable or beta to its channel repository,
# where installed copies find it at their next update check.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, but don't commit, tag or publish
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, never cancelled halfway. A push that lands meanwhile waits its turn and
# then releases everything after the last tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  STABLE_REPO: gitdeskoct/gitdesk
  BETA_REPO: BotCoder254/gitdesk-releases

jobs:
  plan:
    name: Pick the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
      sha: ${{ steps.sha.outputs.sha }}
      publish: ${{ steps.mode.outputs.publish }}
      channel: ${{ steps.destination.outputs.channel }}
      releases_repo: ${{ steps.destination.outputs.releases_repo }}
    steps:
      # The branch's tip when this run starts, not the pushed commit: a run that waited behind
      # another release starts from that release's version commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          case "$API_ORIGIN" in
            https://*) ;;
            *) echo "::error::Set the API_ORIGIN repository secret to the Worker's https origin."; exit 1 ;;
          esac
          publish=true
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then publish=false; fi
          if [ "$publish" = true ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::Only main is released. Run from another branch with dry run ticked."
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - id: version
        run: node .github/scripts/next-version.cjs
      - id: destination
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STABLE_REPO: ${{ env.STABLE_REPO }}
          BETA_REPO: ${{ env.BETA_REPO }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "releases_repo=$BETA_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "releases_repo=$STABLE_REPO" >> "$GITHUB_OUTPUT"
          fi
      - id: check
        name: Not released before
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NEEDS_TAG: ${{ steps.version.outputs.tag }}
          SKIP: ${{ steps.version.outputs.skip }}
          RELEASES_REPO: ${{ steps.destination.outputs.releases_repo }}
        run: |
          skip=$SKIP
          if [ "$SKIP" != true ] && gh release view "v$VERSION" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            if [ "$NEEDS_TAG" != true ]; then
              echo "::notice::v$VERSION is already published and nothing has changed since."
              skip=true
            else
              echo "::error::$RELEASES_REPO already has a release for v$VERSION. Raise the version in package.json above it."
              exit 1
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: plan
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    secrets:
      API_ORIGIN: ${{ secrets.API_ORIGIN }}

  tag:
    name: Commit and tag the version
    needs: [plan, quality]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # Kept only here, so this job alone can push the version commit and tag.
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NEEDS_TAG: ${{ needs.plan.outputs.tag }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if [ "$NEEDS_TAG" != true ]; then
            echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISH" != true ]; then
            echo "Dry run: would commit and tag v$VERSION."
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A version raised by hand is already in package.json, so there may be nothing to commit.
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION" -m '[skip ci]'
          fi
          git tag -a "v$VERSION" -m "gitdesk $VERSION"
          # Push only the release tag. The protected main branch must never be mutated by release automation.
          if ! git push origin "refs/tags/v$VERSION"; then
            echo "::error::The release tag could not be pushed. The run for the newer push can retry it."
            exit 1
          fi
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: [plan, tag]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Already this version on a tag; a dry run builds the untagged commit under the version it would get.
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - run: npm ci
      - name: Build the installer
        env:
          VITE_API_ORIGIN: ${{ secrets.API_ORIGIN }}
          WIN_SIGNING: ${{ vars.WIN_SIGNING }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ vars.WIN_SIGNING == 'required' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ vars.WIN_SIGNING == 'required' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if [ "$WIN_SIGNING" = required ]; then
            if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ] || [ -z "$WIN_PUBLISHER_NAME" ]; then
              echo "::error::WIN_SIGNING is required but WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD or WIN_PUBLISHER_NAME is missing."
              exit 1
            fi
            # publisherName goes into app-update.yml, so installed copies refuse updates signed by anyone else.
            npm run dist -- --win -c.forceCodeSigning=true "-c.win.signtoolOptions.publisherName=$WIN_PUBLISHER_NAME"
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist -- --win
          fi
      - id: signing
        name: Check the signature
        shell: pwsh
        env:
          WIN_SIGNING: ${{ vars.WIN_SIGNING }}
        run: |
          $files = @(Get-ChildItem dist\*.exe) + @(Get-Item dist\win-unpacked\gitdesk.exe)
          $statuses = $files | ForEach-Object { (Get-AuthenticodeSignature $_.FullName).Status }
          $signed = -not ($statuses | Where-Object { $_ -ne 'Valid' })
          $files | ForEach-Object { "{0}: {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }
          if ($env:WIN_SIGNING -eq 'required' -and -not $signed) {
            Write-Output '::error::Signing is required but a file is not validly signed.'
            exit 1
          }
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Updater metadata is packaged
        run: test -f dist/win-unpacked/resources/app-update.yml
      - name: Launch the packaged app
        shell: pwsh
        run: .github/scripts/smoke-windows.ps1 -App dist\win-unpacked\gitdesk.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-linux:
    name: Build Linux
    needs: [plan, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # bsdtar builds the pacman package; xvfb runs the smoke test.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools xvfb
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - run: npm ci
      - name: Build the packages
        env:
          VITE_API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: npm run dist -- --linux
      - name: Updater metadata is packaged
        run: test -f dist/linux-unpacked/resources/app-update.yml
      - name: Launch the packaged app
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/scripts/smoke-linux.sh dist/linux-unpacked/gitdesk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.tar.gz
            dist/latest-linux.yml

  nix:
    name: Nix expression
    needs: [plan, tag, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
          sparse-checkout: nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: linux
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          archive=$(ls linux/*.tar.gz)
          file=$(basename "$archive")
          hash="sha256-$(openssl dgst -sha256 -binary "$archive" | base64 -w0)"
          sed -e "s|^  version = \".*\";|  version = \"$VERSION\";|" \
              -e "s|^  file = \".*\";|  file = \"$file\";|" \
              -e "s|^  hash = .*;|  hash = \"$hash\";|" \
              nix/package.nix > gitdesk.nix
          grep -q "hash = \"$hash\"" gitdesk.nix
          grep -q "file = \"$file\"" gitdesk.nix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix
          if-no-files-found: error
          retention-days: 7
          path: gitdesk.nix

  publish:
    name: Publish the release
    needs: [plan, tag, build-windows, build-linux, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Check every file
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/verify-release.cjs release "$VERSION"
      - name: Write the release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude "v$VERSION" HEAD 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## What's new"
            echo
            git log --no-merges --invert-grep --grep='^Release v[0-9]' --pretty='- %s' -n 50 "$range"
            echo
            echo "## Downloads"
            echo
            echo "- Windows: the \`.exe\` setup program. Installed copies update themselves from Settings › Updates."
            echo "- Linux: the AppImage updates itself; \`.deb\` and pacman packages update through gitdesk with your administrator password; the \`.tar.gz\` archive and \`gitdesk.nix\` update the way you installed them."
            echo "- \`SHA256SUMS.txt\` lists the SHA-256 of every file."
            echo
            if [ "$SIGNED" = true ]; then
              echo "The Windows files are code-signed."
            else
              echo "The Windows files are not code-signed yet, so Windows SmartScreen may warn before the installer runs."
            fi
          } > notes.md
          cat notes.md
      - name: Publish
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ needs.plan.outputs.channel == 'stable' && github.token || secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASES_REPO: ${{ needs.plan.outputs.releases_repo }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the RELEASES_TOKEN secret to this repository: a token that can write releases in $RELEASES_REPO. README › Releasing has the steps."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::$RELEASES_REPO already has a release for v$VERSION. Raise the version in package.json above it."
            exit 1
          fi
          if [ "$CHANNEL" = beta ]; then
            release_flags=(--prerelease)
          else
            release_flags=(--latest)
          fi
          gh release create "v$VERSION" release/* \
            --repo "$RELEASES_REPO" \
            "${release_flags[@]}" \
            --title "gitdesk $VERSION" \
            --notes-file notes.md
          echo "Published https://github.com/$RELEASES_REPO/releases/tag/v$VERSION"
